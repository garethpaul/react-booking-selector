name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node16-runtime:
    name: Node 16 package runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up package build Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies without lifecycle scripts
        run: corepack yarn install --immutable --mode=skip-build
      - name: Build package runtime fixture
        run: |
          corepack yarn lib:build
          package_file="$(npm pack --ignore-scripts --silent)"
          mkdir .node16-package
          tar -xzf "$package_file" --strip-components=1 -C .node16-package
          rm "$package_file"
      - name: Load package entries on Node 16
        run: docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace/.node16-package node:16.20.2-bullseye@sha256:cd59a61258b82b86c1ff0ead50c8a689f6c3483c5ed21036e11ee741add419eb node ../scripts/smoke-package-runtime.js

  node:
    name: Node ${{ matrix.node }} package verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies without lifecycle scripts
        run: corepack yarn install --immutable --mode=skip-build
      - name: Run full verification
        run: make check
      - name: Rebuild publish and docs output
        run: make build
      - name: Verify checked-in distribution is current
        run: git diff --exit-code -- dist
