  <text x="130" y="169" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Controlled React grid for selecting bookable time slots.</text>

  <rect x="130" y="220" width="940" height="312" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
