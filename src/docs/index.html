<!doctype html>
<html lang="en">
  <head>
    <title>React Booking Selector</title>
    <meta charset="UTF-8" />
    <meta name="description" content="A grid-based booking selector." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div id="app"></div>
    </div>
    <script>
      window.process =
        window.process && (typeof window.process === 'object' || typeof window.process === 'function')
          ? window.process
          : {}
      window.process.env = window.process.env && typeof window.process.env === 'object' ? window.process.env : {}
      window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production'
    </script>
    <script type="module" src="./App.js"></script>
  </body>
</html>
